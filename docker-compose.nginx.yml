# ==============================================================================
# Docker Compose Extension: Nginx Reverse Proxy & SSL Gateway
# ==============================================================================
# Usage:
#   docker compose -f docker-compose.prod.yml -f docker-compose.nginx.yml --env-file .env.prod up -d
# ==============================================================================

services:
  nginx:
    image: nginx:1.25-alpine
    container_name: bike_nginx
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./docker/nginx/certbot/conf:/etc/letsencrypt:ro
      - ./docker/nginx/certbot/www:/var/www/certbot:ro
    restart: unless-stopped
    networks:
      - bike_network
    depends_on:
      frontend:
        condition: service_started
      fastapi:
        condition: service_healthy
      airflow-webserver:
        condition: service_healthy

networks:
  bike_network:
    name: bike_sharing_network

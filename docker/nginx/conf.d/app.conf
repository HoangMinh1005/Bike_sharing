# ==============================================================================
# GBFS Bike Sharing Operation Intelligence - HTTP Reverse Proxy Configuration
# ==============================================================================

# Upstream Definitions (Containers in bike_network)
upstream frontend_upstream {
    server frontend:80;
    keepalive 32;
}

upstream fastapi_upstream {
    server fastapi:8000;
    keepalive 32;
}

upstream airflow_upstream {
    server airflow-webserver:8080;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Standard Proxy Headers
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;

    # Timeouts
    proxy_connect_timeout 60s;
    proxy_send_timeout 120s;
    proxy_read_timeout 120s;

    # 1. Certbot ACME Challenge for Let's Encrypt SSL
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    # 2. FastAPI Endpoints (/api/...)
    location /api/ {
        proxy_pass http://fastapi_upstream/api/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # Buffering settings
        proxy_buffering on;
        proxy_buffer_size 8k;
        proxy_buffers 8 8k;
    }

    # 3. FastAPI Interactive Documentation (/docs, /redoc, /openapi.json)
    location /docs {
        proxy_pass http://fastapi_upstream/docs;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    location /redoc {
        proxy_pass http://fastapi_upstream/redoc;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    location /openapi.json {
        proxy_pass http://fastapi_upstream/openapi.json;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # 4. Airflow Web UI Subpath (/airflow/)
    # NOTE: If using subpath, ensure AIRFLOW__WEBSERVER__BASE_URL is set appropriately.
    location /airflow/ {
        proxy_pass http://airflow_upstream/;
        proxy_http_version 1.1;

        # WebSocket support for Airflow log streaming & graph interactions
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Subpath header
        proxy_set_header X-Forwarded-Prefix /airflow;

        # Avoid redirects stripping port or scheme
        proxy_redirect default;
    }

    # 5. Frontend React SPA Dashboard (Root /)
    location / {
        proxy_pass http://frontend_upstream;
        proxy_http_version 1.1;

        # WebSocket support for Vite HMR if in development mode
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Cache control for static assets served by frontend
        location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|svg|woff|woff2|ttf|eot)$ {
            proxy_pass http://frontend_upstream;
            proxy_set_header Host $host;
            expires 30d;
            add_header Cache-Control "public, no-transform";
        }
    }

    # Error Pages
    error_page 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}

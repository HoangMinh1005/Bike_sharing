version: "3.8"

x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: docker/airflow/Dockerfile
  environment: &airflow-common-env
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: "postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/airflow"
    AIRFLOW__CORE__EXECUTOR: "LocalExecutor"
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__LOGGING_LEVEL: "INFO"
    AIRFLOW__SCHEDULER__DAG_DIR_LIST_INTERVAL: "30"
    PYTHONPATH: "/opt/airflow"

    DATABASE_URL: "${DATABASE_URL:-postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-bike_sharing}}"
    REDIS_URL: "${REDIS_URL:-redis://redis:6379/0}"
    GBFS_BASE_URL: "${GBFS_BASE_URL:-https://gbfs.lyft.com/gbfs/2.3/bkn/en}"
    GBFS_LANGUAGE: "${GBFS_LANGUAGE:-en}"
    ENV: "production"

  volumes:
    - ./dags:/opt/airflow/dags:ro
    - ./src:/opt/airflow/src:ro
    - ./sql:/opt/airflow/sql:ro
    - ./data:/opt/airflow/data
    - ./scripts:/opt/airflow/scripts:ro
    - airflow_logs:/opt/airflow/logs

  user: "${AIRFLOW_UID:-50000}:0"

  networks:
    - bike_network

  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy


services:
  postgres:
    image: postgres:15-alpine
    container_name: bike_postgres
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-postgres}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-postgres}"
      POSTGRES_DB: "${POSTGRES_DB:-bike_sharing}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-bike_sharing}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - bike_network


  redis:
    image: redis:7-alpine
    container_name: bike_redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - bike_network


  airflow-init:
    <<: *airflow-common
    container_name: bike_airflow_init
    command: >
      bash -c "airflow db migrate &&
      (airflow users create
      --username $${AIRFLOW_USERNAME:-admin}
      --password $${AIRFLOW_PASSWORD:-admin}
      --firstname Admin
      --lastname User
      --role Admin
      --email admin@example.com || true)"
    restart: on-failure
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy


  airflow-webserver:
    <<: *airflow-common
    container_name: bike_airflow_webserver
    command: webserver
    ports:
      - "${AIRFLOW_WEBSERVER_PORT:-8080}:8080"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8080/health').read()\""
        ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy


  airflow-scheduler:
    <<: *airflow-common
    container_name: bike_airflow_scheduler
    command: scheduler
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type SchedulerJob --hostname "$${HOSTNAME}" || exit 1']
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy


  fastapi:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bike_fastapi
    command: ["uvicorn", "api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "${FASTAPI_PORT:-8000}:8000"
    environment:
      PYTHONPATH: "/app"
      DATABASE_URL: "${DATABASE_URL:-postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-bike_sharing}}"
      REDIS_URL: "${REDIS_URL:-redis://redis:6379/0}"
      GBFS_BASE_URL: "${GBFS_BASE_URL:-https://gbfs.lyft.com/gbfs/2.3/bkn/en}"
      GBFS_LANGUAGE: "${GBFS_LANGUAGE:-en}"
      FRONTEND_ORIGINS: "${FRONTEND_ORIGINS:-*}"
      ENV: "production"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health').read()\""
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    networks:
      - bike_network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy


  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: "${VITE_API_BASE_URL:-http://localhost:8000/api/v1}"
    container_name: bike_frontend
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    restart: unless-stopped
    networks:
      - bike_network
    depends_on:
      fastapi:
        condition: service_healthy


networks:
  bike_network:
    name: bike_sharing_network
    driver: bridge


volumes:
  postgres_data:
    name: bike_postgres_data

  redis_data:
    name: bike_redis_data

  airflow_logs:
    name: bike_airflow_logs